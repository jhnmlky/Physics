<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Physics</title>
</head>
<body>
    <div id="inputs" class="inputs">
        <div id="props" class="props balls">
            <h5>Ball</h5>
            <div id="prop" class="prop">
                <div id="field" class="field">
                    <label for="mass">Mass (kg)</label>
                    <input type="number" name="mass" id="mass" value="1" step="1" placeholder="kg">
                </div>
                <div id="field" class="field">
                    <label for="size">Size (px)</label>
                    <input type="number" name="size" id="size" value="50" step="1" min="10" placeholder="r²">
                </div>
                <div id="field" class="field">
                    <label for="velx">Velocity (x)</label>
                    <input type="number" name="velx" id="velx" value="0" step="0.1" placeholder="Velocity X">
                </div>
                <div id="field" class="field">
                    <label for="vely">Velocity (y)</label>
                    <input type="number" name="vely" id="vely" value="0" step="0.1" placeholder="Velocity Y">
                </div>
                <div id="field" class="field">
                    <label for="friction">Friction</label>
                    <input type="number" name="friction" id="friction" value="0.5" step="0.1" placeholder="Friction">
                </div>
                <div id="field" class="field">
                    <button id="reset" class="action reset">Reset</button>
                </div>
            </div>
        </div>
        <div id="props" class="props env">
            <h5>Environment</h5>
            <div id="prop" class="prop">
                <div id="field" class="field">
                    <label for="fps">FPS</label>
                    <select name="fps" id="fps" placeholder="g">
                        <option value="24">24</option>
                        <option value="60" selected>60</option>
                        <option value="120">120</option>
                    </select>
                </div>
                <div id="field" class="field">
                    <label for="gravity">Gravity (g)</label>
                    <input type="number" name="gravity" id="gravity" value="9.81" step="0.01" placeholder="g">
                </div>
                <div id="field" class="field">
                    <label for="direction">Gravity Direction</label>
                    <select name="direction" id="direction">
                        <option value="top">Top</option>
                        <option value="right">Right</option>
                        <option value="bottom" selected>Bottom</option>
                        <option value="left">Left</option>
                    </select>
                </div>
                <div id="field" class="field">
                    <label id="label-speed" for="speed">Speed: 1</label>
                    <input type="range" name="speed" id="speed" min="1" max="100" value="1" step="1">
                </div>
                <div id="field" class="field">
                    <label for="drag">Drag</label>
                    <input type="number" name="drag" id="drag" value="0.1" step="0.01" placeholder="drag">
                </div>
                <div id="field" class="field">
                    <label for="bounce">Bounciness</label>
                    <input type="number" name="bounce" id="bounce" value="0.8" step="0.1" placeholder="bounce">
                </div>
                <div id="field" class="field">
                    <label for="frictionW">Friction</label>
                    <input type="number" name="frictionW" id="frictionW" value="0.5" step="0.1" placeholder="friction">
                </div>
            </div>
        </div>
    </div>
    
    <div id="box" class="box"></div>

    <script type="module" src="script.js"></script>
</body>
</html>
